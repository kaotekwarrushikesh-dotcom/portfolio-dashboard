<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1>Rushikesh Kaotekwar</h1>
        <p class="subtitle">Project Dashboard: built for interview review and ongoing learning</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search" type="search" placeholder="Search projects..." aria-label="Search projects" />
      <div id="filters" class="filters" role="group" aria-label="Filter by tag"></div>
    </section>

    <section id="project-grid" class="project-grid" aria-live="polite"></section>

    <p id="empty-state" class="empty-state" hidden>No projects match your filters yet.</p>
  </main>

  <footer class="site-footer">
    <p>To add a project: edit <code>projects.json</code>, then <code>git add</code>, <code>git commit</code>, <code>git push</code>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
